# Staging Cloud Database (e.g., AWS RDS)
spring.datasource.url=jdbc:postgresql://your-staging-db.aws.com:5432/secondbrain_stage
spring.datasource.username=${STAGING_DB_USER}
spring.datasource.password=${STAGING_DB_PASS}

# Staging Redis (e.g., AWS ElastiCache)
spring.data.redis.host=your-staging-redis.aws.com

# OpenRouter - Maybe testing a stronger, paid model
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=google/gemini-1.5-flash