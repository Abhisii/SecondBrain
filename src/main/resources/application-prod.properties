# Production Cloud Database
spring.datasource.url=jdbc:postgresql://your-prod-db.aws.com:5432/secondbrain_prod
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASS}

# Production Redis
spring.data.redis.host=your-prod-redis.aws.com

# OpenRouter - Production-grade model
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=anthropic/claude-3-haiku