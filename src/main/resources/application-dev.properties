# ==========================================
# DATABASE (Local Docker PGVector)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/secondbrain
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# REDIS (Local Caching)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# SPRING AI: OpenRouter (Chat Generation)
# ==========================================
# Pulls the API key from your system environment variables
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.3

# ==========================================
# SPRING AI: Local Transformers (Embeddings)
# ==========================================
# CRITICAL: Disable OpenAI embeddings so the local Transformers model runs
spring.ai.openai.embedding.enabled=false

# ==========================================
# SPRING AI: PGVector Store Configuration
# ==========================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# 384 is the dimension size for the all-MiniLM-L6-v2 local model
spring.ai.vectorstore.pgvector.dimensions=384
# Auto-creates the vector extension and tables in Postgres on startup
spring.ai.vectorstore.pgvector.initialize-schema=true